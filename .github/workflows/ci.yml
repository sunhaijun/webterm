name: CI

# E2E 不在这里，也不在 CI 上自动跑：它太费 Actions 额度，本地 `make e2e` 跑。
# e2e.yml 只剩手动触发（gh workflow run E2E），见 docs/70-testing/strategy.md §CI。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go 单测与集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 【前端必须先构建】：Go 侧的 HTTP 测试会请求 GET /，
      # 而前端是 go:embed 进来的（不变式 2 同源）。不构建的话嵌进去的是
      # 空目录，静态路由返回 503，IT-auth-1 的「不需要认证的路由 = 200」就挂。
      - run: npm ci && npm run build
        working-directory: web
      # shell 集成测试需要真 bash（m5 起）
      - run: bash --version
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 15m
      - name: 竞态检测
        run: go test ./... -race -count=1 -timeout 20m

  web:
    name: 前端单测与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      # 协议向量与 Go 侧共用同一份 fixture，两边都跑它防止实现漂移
      - run: npm test
        working-directory: web

  static:
    name: 单二进制（AC-8.1）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 前端必须先构建：产物是 go:embed 的输入，顺序反了嵌进去的就是空目录
      - run: npm ci && npm run build
        working-directory: web
      # 不变式 1：不引入 cgo，GOOS=linux GOARCH=amd64 go build 必须直接出货
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o webterm ./cmd/webterm
      - name: 断言不是动态可执行文件
        run: ldd webterm 2>&1 | grep -q 'not a dynamic executable'
      - name: 断言前端真的嵌进去了（AC-8.2 / IT-embed-1）
        run: |
          rm -rf internal/webui/dist/assets   # 删掉产物，二进制仍应能提供前端
          ./webterm version
          test -x webterm
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./...

  fmt:
    name: 格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "以下文件未格式化:"; echo "$out"; exit 1; fi

  docs:
    name: 文档链接
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/ 是唯一事实来源，坏链等于文档腐烂
      - run: python3 scripts/check-doc-links.py
