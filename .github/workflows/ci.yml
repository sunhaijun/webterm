name: CI

# One job for every check: Actions bills each job rounded up to the minute, and
# splitting would also rebuild the frontend several times. Build once, reuse.
#
# Runs on pull requests only: the pull_request event already tests the merge result.
# E2E runs locally (`make e2e`) or on demand via e2e.yml; see docs/70-testing/strategy.md.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Cheap checks first: fail fast.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "These files need gofmt:"; echo "$out"; exit 1; fi
      - name: Doc links
        run: python3 scripts/check-doc-links.py
      - run: go vet ./...

      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      # Also runs the protocol vectors shared with the Go tests.
      - name: Web unit tests
        run: npm test
        working-directory: web

      # Go HTTP tests request GET / from the embedded frontend; without a build the
      # embed is empty and static routes return 503. The same build feeds the
      # single-binary checks below.
      - name: Build frontend
        run: npm run build
        working-directory: web

      - run: bash --version
      # One pass with -race covers everything; a second plain run would only repeat it.
      - name: Go tests (race detector)
        run: go test ./... -race -count=1 -timeout 15m

      # Invariant: no cgo; a plain cross-compile must produce the release binary.
      - name: Static binary (AC-8.1)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o webterm ./cmd/webterm
      - name: Not a dynamic executable
        run: ldd webterm 2>&1 | grep -q 'not a dynamic executable'
      - name: Frontend is embedded (AC-8.2 / IT-embed-1)
        run: |
          rm -rf internal/webui/dist/assets   # the binary must still serve the frontend
          ./webterm version
          test -x webterm
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./...
