name: Release

# Every push to main refreshes the rolling `dev` prerelease; every v* tag publishes a
# release, and refreshes `dev` too when it's on main's head (AC-8.9). Both ship
# webterm-linux-{amd64,arm64}, install.sh and SHA256SUMS.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cross-compile into release/
        run: make release

      - name: Not a dynamic executable (AC-8.1)
        run: |
          file release/webterm-linux-amd64 | tee /dev/stderr | grep -q 'statically linked'
          ldd release/webterm-linux-amd64 2>&1 | grep -q 'not a dynamic executable'

      - name: Frontend is embedded (AC-8.2)
        run: |
          grep -qa 'id="app"' release/webterm-linux-amd64
          release/webterm-linux-amd64 version

      # A wrong version string shows up nowhere else, so make it fail loudly here.
      - name: Release version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          got="$(release/webterm-linux-amd64 version)"
          echo "$got"
          test "$got" = "webterm ${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: webterm-binaries
          path: release/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install or upgrade on a Linux server:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | bash
          \`\`\`" \
            --generate-notes

  # dev is main's head with the version that commit has now (AC-8.9,
  # docs/80-ops/development.md#releases). A release is tagged seconds after its merge
  # is pushed, so main's run may have built before the tag existed; then the tag's
  # run publishes dev instead.
  dev:
    name: Refresh the dev prerelease
    needs: build
    runs-on: ubuntu-latest
    # One run at a time decides and publishes, so runs can't interleave the delete
    # and create, or publish an older commit over a newer one.
    concurrency:
      group: dev-prerelease
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4 # scripts/dev-prerelease.sh

      - uses: actions/download-artifact@v4
        with:
          name: webterm-binaries
          path: release/

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x release/webterm-linux-*
          export REF="$GITHUB_REF" SHA="$GITHUB_SHA"
          MAIN_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          TAGS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" \
            --jq ".[] | select(.commit.sha == \"$GITHUB_SHA\") | .name | select(startswith(\"v\"))")"
          VERSION="$(release/webterm-linux-amd64 version)"
          export MAIN_HEAD TAGS VERSION
          decision="$(bash scripts/dev-prerelease.sh)"
          echo "$decision"
          echo "publish=$([ "$decision" = publish ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "version=${VERSION#webterm }" >>"$GITHUB_OUTPUT"

      - name: Publish dev
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev release/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "dev (rolling build of main)" \
            --notes "Automatic build of main at \`${GITHUB_SHA::7}\` (\`${VERSION}\`), replaced on every push. Use a \`v*\` release unless you need the latest changes.

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/dev/install.sh | bash -s -- --channel dev
          \`\`\`"
