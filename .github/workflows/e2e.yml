name: E2E

# E2E（真二进制 + 真浏览器）【在 CI 上不自动跑】—— 一次约 6 分钟，太费 Actions 额度。
# 本地 `make e2e` 全绿是每个 PR 的硬门槛（CLAUDE.md），没有 CI 兜底。
# 这里只留【手动】触发，想要 CI 上的结论时自己点一次：
#
#   gh workflow run E2E --ref <分支>
#
# 值得手动跑一次的场合：改动触及协议 / 重连 / 输入 / 布局，或改了 E2E 与构建本身。
# 见 docs/70-testing/strategy.md §CI。
on:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E（真二进制 + 真浏览器）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # 完整构建是 E2E 的前置 —— 这保证了 go:embed 的路径是真的通的
      - run: npm run build
        working-directory: web
      - run: go build -o webterm ./cmd/webterm
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
