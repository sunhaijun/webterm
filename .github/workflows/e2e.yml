name: E2E

# End-to-end tests (real binary + real browser), on demand only:
#
#   gh workflow run E2E --ref <branch>
#
# Run it for changes to the protocol, reconnects, input or layout. Locally: `make e2e`.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E (real binary + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # A full build first, so the go:embed path is exercised for real.
      - run: npm run build
        working-directory: web
      - run: go build -o webterm ./cmd/webterm
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
